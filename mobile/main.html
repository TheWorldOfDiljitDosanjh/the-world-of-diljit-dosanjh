<!-- MOBILE VERSION - MAIN.HTML                   -->
<!-- ============================================ -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Main - World of Diljit Dosanjh</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="has-player">
    <!-- Sticky Header -->
    <header>
        <nav>
            <a href="index.html" class="nav-item" data-page="home">
                <img src="images/icons/home.png" alt="Home" class="nav-icon">
            </a>
            <a href="#games" class="nav-item active-text" data-page="games">Games</a>
            <a href="#library" class="nav-item" data-page="library">Library</a>
            <a href="#lyrics" class="nav-item" data-page="lyrics">Lyrics</a>
            <a href="settings.html" class="nav-item" data-page="settings">
                <img src="images/icons/settings.png" alt="Settings" class="nav-icon">
            </a>
            <!-- Sliding dot for all header items -->
            <div class="slider-dot" id="slider-dot"></div>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Games Section -->
        <section id="games" class="page-section active">
            <h2>Games</h2>
            <div id="games-container">
                <!-- Game boxes will be dynamically generated -->
                <p>Games coming soon...</p>
            </div>
        </section>

        <!-- Library Section -->
        <section id="library" class="page-section">
            <h2>Library</h2>
            <div id="library-container">
                <a href="#" id="playlist-link" target="_blank">Open playlist in Spotify</a>
                
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search...">
                    <div class="search-dropdown" id="search-dropdown">
                        <button class="dropdown-toggle" id="search-toggle">
                            <span id="search-type-label">Search</span>
                            <img src="images/icons/dropdown.png" alt="Dropdown" class="dropdown-icon">
                        </button>
                        <ul class="dropdown-menu" id="search-menu">
                            <li data-search-type="song">Song</li>
                            <li data-search-type="album">Album</li>
                        </ul>
                    </div>
                    <div class="search-dropdown" id="sort-dropdown">
                        <button class="dropdown-toggle" id="sort-toggle">
                            <span id="sort-type-label">Sort</span>
                            <img src="images/icons/dropdown.png" alt="Dropdown" class="dropdown-icon">
                        </button>
                        <ul class="dropdown-menu" id="sort-menu">
                            <li data-sort-type="name">Name</li>
                            <li data-sort-type="date">Date</li>
                        </ul>
                    </div>
                </div>

                <div id="album-list">
                    <!-- Albums will be dynamically generated -->
                    <p>No songs loaded yet.</p>
                </div>
            </div>
        </section>

        <!-- Lyrics Section -->
        <section id="lyrics" class="page-section">
            <h2 id="lyrics-song-title">Select a song first</h2>
            <div class="lyrics-controls">
                <span class="sync-label">Sync</span>
                <div class="toggle-switch" id="sync-toggle">
                    <div class="toggle-knob"></div>
                </div>
            </div>
            <div id="lyrics-container">
                <p id="lyrics-text">Select a song from the Library to see lyrics here.</p>
            </div>
        </section>
    </main>

    <!-- Player Controls - Only on main.html -->
    <div id="player-controls">
        <!-- Progress Bar - Top edge of player -->
        <div id="progress-wrapper">
            <div id="progress-border-fill"></div>
            <div id="progress-dot"></div>
        </div>
        <!-- Top Row: Time | Song Name | Duration -->
        <div class="player-row-top">
            <span id="current-time">0:00</span>
            <span id="current-song-name">-</span>
            <span id="song-duration">0:00</span>
        </div>
        <!-- Bottom Row: Shuffle | Prev | Rew | Play | Fwd | Next | Loop -->
        <div class="player-row-bottom">
            <button id="shuffle-btn" class="player-btn">
                <img src="images/icons/shuffle-off.png" alt="Shuffle" id="shuffle-icon">
            </button>
            <button id="prev-btn" class="player-btn">
                <img src="images/icons/previous.png" alt="Previous">
            </button>
            <button id="rewind-btn" class="player-btn">
                <img src="images/icons/rewind.png" alt="Rewind">
            </button>
            <button id="play-btn" class="player-btn play-btn-large">
                <img src="images/icons/play.png" alt="Play" id="play-icon">
            </button>
            <button id="forward-btn" class="player-btn">
                <img src="images/icons/forward.png" alt="Forward">
            </button>
            <button id="next-btn" class="player-btn">
                <img src="images/icons/next.png" alt="Next">
            </button>
            <button id="loop-btn" class="player-btn">
                <img src="images/icons/loop-off.png" alt="Loop" id="loop-icon">
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
